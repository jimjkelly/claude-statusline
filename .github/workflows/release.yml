name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare versions
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          crate=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          if [ "$TAG_NAME" != "v${crate}" ]; then
            echo "Tag $TAG_NAME does not match Cargo.toml version $crate" >&2
            exit 1
          fi
          echo "Tag $TAG_NAME matches Cargo.toml version $crate"

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    # Windows runners default to pwsh, where "$VAR" does not expand. Every step
    # in this job uses POSIX shell syntax, so pin bash for all of them.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # x64 only: Windows on ARM runs x64 binaries under emulation, and
          # cross-linking aarch64-pc-windows-msvc depends on ARM64 MSVC tools
          # being present on the runner image. Not worth blocking a release on.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Deliberately uncached: a poisoned cache must not be able to reach a
      # published artifact. Release builds start clean.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          # macOS ships shasum but not sha256sum; Linux and Git Bash ship both.
          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }
          staging="claude-statusline-${TARGET}"
          mkdir -p "$staging"
          cp README.md LICENSE-MIT LICENSE-APACHE CHANGELOG.md "$staging/"
          if [ "${RUNNER_OS}" = "Windows" ]; then
            cp "target/${TARGET}/release/claude-statusline.exe" "$staging/"
            if command -v 7z >/dev/null 2>&1; then
              7z a "${staging}.zip" "$staging" >/dev/null
            else
              powershell -Command \
                "Compress-Archive -Path '${staging}' -DestinationPath '${staging}.zip'"
            fi
            checksum "${staging}.zip" > "${staging}.zip.sha256"
          else
            cp "target/${TARGET}/release/claude-statusline" "$staging/"
            tar czf "${staging}.tar.gz" "$staging"
            checksum "${staging}.tar.gz" > "${staging}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-statusline-${{ matrix.target }}
          path: |
            claude-statusline-${{ matrix.target }}.tar.gz
            claude-statusline-${{ matrix.target }}.tar.gz.sha256
            claude-statusline-${{ matrix.target }}.zip
            claude-statusline-${{ matrix.target }}.zip.sha256
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG_NAME" \
            --generate-notes \
            dist/*
