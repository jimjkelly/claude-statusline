[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Everything in the current tree is MIT/Apache-2.0/Unicode. Adding a license
# here should be a deliberate decision, not a reflex to unbreak CI.
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
