[package]
name = "claude-statusline"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Claude Code statusline showing session and weekly rate-limit usage"
repository = "https://github.com/jimjkelly/claude-statusline"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2.2"

[dev-dependencies]
insta = { version = "1", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGEventSource", "CGEventTypes", "CGSession"] }
objc2-io-kit = { version = "=0.3.2", default-features = false, features = ["std", "libc"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
